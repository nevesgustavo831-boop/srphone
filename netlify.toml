# Mascote: sem um GLB de artista (srphone-assistant.glb, opcional) na pasta, o site recebe no lugar
# dele um aviso pequeno (sem erro 404 no console) e mostra o mascote 3D da marca (feito no código).
# Sem "force": quando o arquivo existir, ele é entregue normalmente e esta regra não vale.
[[redirects]]
  from = "/assets/modelos/srphone-assistant.glb"
  to = "/assets/modelos/sem-modelo.json"
  status = 200

# Produto novo que ainda não ganhou a página própria (produto/<id>/, criada pelo "npm run build"):
# a Netlify manda para o início, que abre o produto. Página existente sempre tem prioridade.
[[redirects]]
  from = "/produto/:id/"
  to = "/?produto=:id"
  status = 302
[[redirects]]
  from = "/produto/:id"
  to = "/?produto=:id"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; img-src 'self' data: blob: https://*.google-analytics.com https://*.googletagmanager.com https://tile.googleapis.com; media-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'wasm-unsafe-eval' https://www.googletagmanager.com https://challenges.cloudflare.com; connect-src 'self' blob: https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://*.supabase.co https://tile.googleapis.com; frame-src https://www.google.com https://www.youtube-nocookie.com https://challenges.cloudflare.com; manifest-src 'self'; object-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), microphone=(), camera=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Área da Equipe: fora dos buscadores e nunca guardada em cache (nem no navegador, nem no caminho).
# Esconder o endereço não é a proteção: quem protege os dados é o banco (login + funcionarios + RLS).
[[headers]]
  for = "/funcionario/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
