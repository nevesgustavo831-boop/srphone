[build]
  publish = "."

# ---------- funções do servidor: o Assistente SR Phone com IA e o cálculo de entrega ----------
# netlify/functions/assistente.mjs responde em /api/assistente, netlify/functions/entrega.mjs em
# /api/entrega e netlify/functions/agendamento.mjs em /api/agendamento (o endereço está em cada
# arquivo). As chaves ficam SÓ nas variáveis de ambiente do Netlify (AI_API_KEY, MAPS_SERVER_KEY,
# MAPS_BROWSER_KEY, SUPABASE_SECRET_KEY e TURNSTILE_SECRET_KEY), nunca no site.
# Funções só são publicadas por Git (deploy contínuo) ou pelo Netlify CLI; arrastar a pasta
# para o painel (Netlify Drop) publica só o site, e aí o chat usa o cérebro local e a entrega
# oferece a retirada e o WhatsApp.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # os dados oficiais (loja, catálogo, regras de preço e DELIVERY_CONFIG) vão junto com as funções
  included_files = ["data/config.js", "data/products.js", "js/precos.js"]

# A Netlify já responde 404.html com status HTTP 404 automaticamente.
# Mantenha os cabeçalhos IGUAIS aos do arquivo _headers ("npm run lint" confere).

# ---------- endereços ----------
# Pastas e arquivos de trabalho do projeto não vão para o visitante (respondem 404).
[[redirects]]
  from = "/ferramentas/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
