<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e0a08">
<title>Página não encontrada | SR Phone Macaé</title>
<link rel="icon" href="/assets/icons/favicon-48.png" sizes="48x48" type="image/png">
<link rel="icon" href="/assets/icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/assets/icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="/js/boot.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Manrope:wght@400;600;700&display=swap" media="print" data-fontes>
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Manrope:wght@400;600;700&display=swap"></noscript>
<style>
:root{color-scheme:dark;--bg:#0e0a08;--surface:#15100c;--line:rgba(255,255,255,.10);--line-2:rgba(255,255,255,.18);
  --ink:#F7EFE6;--ink-2:#BFAE9E;--ink-3:#978676;--accent:#FF6A21;--accent-hi:#FF8A4D;--on-accent:#0A0502}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
  font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px;text-align:center;
  background-image:radial-gradient(60% 50% at 50% 30%,rgba(255,106,33,.08),transparent 70%)}
.caixa{max-width:480px}
.marca{display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);margin-bottom:30px}
.marca img{width:56px;height:56px;border-radius:50%}
.marca b{font-family:"Bricolage Grotesque",sans-serif;font-size:22px;letter-spacing:-.02em}
.codigo{font-family:ui-monospace,monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-hi);margin:0 0 12px}
h1{font-family:"Bricolage Grotesque",sans-serif;font-size:clamp(28px,6vw,38px);letter-spacing:-.03em;line-height:1.1;margin:0 0 14px}
p{color:var(--ink-2);font-size:16px;line-height:1.6;margin:0 0 30px}
.acoes{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.acoes a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;text-decoration:none;font-weight:700;
  font-size:15px;padding:13px 26px;border-radius:999px;border:1px solid transparent;transition:background-color .16s,border-color .16s}
.p{background:var(--accent);color:var(--on-accent)}
.p:hover{background:var(--accent-hi)}
.s{border-color:var(--line-2);color:var(--ink)}
.s:hover{border-color:var(--accent);color:var(--accent-hi)}
a:focus-visible{outline:2px solid var(--accent-hi);outline-offset:3px}
@media(max-width:420px){.acoes a{flex:1 1 100%}}
</style>
</head>
<body>
  <main class="caixa">
    <a class="marca" href="/"><img src="/assets/icons/logo-192.png" width="56" height="56" alt=""><b>SR Phone</b></a>
    <p class="codigo">Erro 404</p>
    <h1>Esta página não existe</h1>
    <p>O endereço que você abriu não está no site da SR Phone. Pode ser um link antigo ou um erro de digitação.</p>
    <div class="acoes">
      <a class="p" href="/">Voltar ao início</a>
      <a class="s" href="/#catalogo">Ver produtos</a>
    </div>
  </main>
</body>
</html>
